[build]
  base = "."
  command = "pnpm install --frozen-lockfile && pnpm --filter web build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "9"
  VITE_CONVEX_URL = "https://frugal-goldfish-605.convex.cloud"

# SPA fallback — every unmatched path serves index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Audio manifest is generated at build time; do not cache it.
[[headers]]
  for = "/audio/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"

# Hashed JS/CSS assets get aggressive caching.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Audio files — long cache but allow revalidation.
[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
